name: Package Emu SDK (Win64)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create/upload Release assets
  actions: read

jobs:
  package-win64:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Ensure CMake is available
      uses: lukka/get-cmake@latest

    - name: Ensure PowerShell 7 is available (vcpkg requirement)
      shell: pwsh
      run: |
        if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
          choco install powershell-core -y
        }
        pwsh -v

    # vcpkg 
    - name: Clone vcpkg
      shell: cmd
      run: |
        if not exist Emu\external\vcpkg (
          git clone https://github.com/microsoft/vcpkg.git Emu\external\vcpkg
        )

    - name: Bootstrap vcpkg
      shell: cmd
      run: |
        cd Emu\external\vcpkg
        bootstrap-vcpkg.bat

    - name: Install vcpkg dependencies (x64-windows) (retry)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        cd Emu/external/vcpkg

        $cmd = '.\vcpkg.exe install --triplet x64-windows sdl2 sdl2-image sdl2-mixer nlohmann-json'
        $tries = 3
        for ($i=1; $i -le $tries; $i++) {
          try {
            Write-Host "Attempt ${i}/${tries}: ${cmd}"
            iex $cmd
            break
          } catch {
            if ($i -eq $tries) { throw }
            Start-Sleep -Seconds (20 * $i)
          }
        }

    # Box2D Release
    - name: Build Box2D (Release install)
      shell: cmd
      run: |
        cd Emu\external\box2d
        if not exist build mkdir build
        cd build
        cmake -DBOX2D_BUILD_DOCS=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="install" ..
        cmake --build . --config Release
        cmake --build . --config Release --target INSTALL

    # Premake
    - name: Generate solution with Premake (engine only)
      shell: pwsh
      run: |
        .\Emu\external\premake\premake5.exe --engine-only vs2022

    # Build engine
    - name: Build Emu (Distribution x64)
      shell: pwsh
      run: |
        msbuild EMUEngine.sln /t:Emu /p:Configuration=Distribution /p:Platform=x64 /m

    # Package
    - name: Stage SDK folder
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        $version = "${{ github.ref_name }}"
        if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }

        $root = "dist\EmuSDK-$version-win64"
        $includeDir = "$root\include"
        $libDir     = "$root\lib"
        $binDir     = "$root\bin"
        $exDir      = "$root\examples\SandBox"

        New-Item -ItemType Directory -Force -Path $includeDir,$libDir,$binDir,$exDir | Out-Null

        # Public headers
        Copy-Item -Recurse -Force "Emu\public\*" $includeDir

        # Emu.lib
        $emuLib = "bin\Distribution-x86_64\Emu\Emu.lib"
        if (!(Test-Path $emuLib)) { throw "Expected Emu.lib not found at: $emuLib" }
        Copy-Item -Force $emuLib $libDir

        # Runtime + link libs
        $vcpkgBin = "Emu\external\vcpkg\installed\x64-windows\bin"
        if (!(Test-Path $vcpkgBin)) { throw "vcpkg bin folder not found at: $vcpkgBin" }

        $vcpkgLib = "Emu\external\vcpkg\installed\x64-windows\lib"
        if (!(Test-Path $vcpkgLib)) { throw "vcpkg lib folder not found at: $vcpkgLib" }

        # DLLs needed to run examples
        Copy-Item -Force "$vcpkgBin\*.dll" $binDir

        # Import libs. Copying all for now.
        Copy-Item -Force "$vcpkgLib\*.lib" $libDir

        # Example source
        if (Test-Path "SandBox") { Copy-Item -Recurse -Force "SandBox\*" $exDir }

        # README / license
        if (Test-Path "README.md") { Copy-Item -Force "README.md" $root }
        if (Test-Path "LICENSE")   { Copy-Item -Force "LICENSE" $root }

    - name: Create zip
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $version = "${{ github.ref_name }}"
        if ([string]::IsNullOrWhiteSpace($version)) { $version = "dev" }

        $zipPath = "dist\EmuSDK-$version-win64.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Compress-Archive -Path "dist\EmuSDK-$version-win64\*" -DestinationPath $zipPath

    - name: Upload SDK zip artifact
      uses: actions/upload-artifact@v4
      with:
        name: EmuSDK-win64
        path: dist/*.zip

    # Attach to GitHub Release on tag pushes
    - name: Attach zip to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
